<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News &amp; Events | SAGES Sonhat</title>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="/images/favicon.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <div class="page-banner">
    <h1>News &amp; Events</h1>
    <div class="breadcrumb"><a href="/">Home</a> / News &amp; Events</div>
  </div>

  <section>
    <div class="container three-col">
      <div class="panel" id="notices">
        <div class="panel-head"><h3>📢 Notices</h3></div>
        <div class="panel-body" style="height:auto"><ul class="scroll-list" data-render="notices"></ul></div>
      </div>
      <div class="panel" id="news">
        <div class="panel-head"><h3>📰 News</h3></div>
        <div class="panel-body" style="height:auto"><ul class="scroll-list" data-render="news"></ul></div>
      </div>
      <div class="panel" id="events">
        <div class="panel-head"><h3>📅 Upcoming Events</h3></div>
        <div class="panel-body" style="height:auto"><ul class="scroll-list" data-render="events"></ul></div>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="/js/main.js"></script>
</body>
</html>
