<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admission | SAGES Sonhat</title>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="/images/favicon.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <div class="page-banner">
    <h1>Admission</h1>
    <div class="breadcrumb"><a href="/">Home</a> / Admission</div>
  </div>

  <section id="process">
    <div class="container content">
      <div class="section-title"><span>Session 2026-27</span><h2>Admission Process</h2></div>
      <div class="download-row" data-render="admissionForm"></div>
      <div class="card-grid" data-render="admissionSteps"></div>
      <div class="info-box" data-render="admissionNote"></div>
    </div>
  </section>

  <section id="documents" class="bg-soft">
    <div class="container two-col content">
      <div data-render="eligibility"></div>
      <div data-render="documents"></div>
    </div>
  </section>

  <section id="registration">
    <div class="container" style="max-width:760px">
      <div class="section-title"><span>Enquiry</span><h2>Registration Enquiry</h2></div>
      <form class="form">
        <div class="row">
          <div><label>Student's Name</label><input required></div>
          <div><label>Parent's Name</label><input required></div>
        </div>
        <div class="row">
          <div><label>Class Applying For</label>
            <select required><option value="">Select class</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option></select></div>
          <div><label>Mobile Number</label><input type="tel" pattern="[0-9]{10}" placeholder="10-digit number" required></div>
        </div>
        <div><label>Village / Address</label><textarea rows="3"></textarea></div>
        <button class="btn" type="submit">Submit Enquiry</button>
        <div class="form-msg">Thank you! The school office will contact you soon.</div>
      </form>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="/js/main.js"></script>
</body>
</html>
