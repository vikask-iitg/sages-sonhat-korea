<body>
  <div id="site-header"></div>

  <div class="page-banner">
    <h1>School Timetable</h1>
    <div class="breadcrumb"><a href="/">Home</a> / <a href="/pages/administration.html">Administration</a> / School Timetable</div>
  </div>

  <!-- Full timetable, kept up to date from the admin panel's Arrangement section (js/timetable-view.js) -->
  <section>
    <div class="container" id="timetable">
      <p class="empty">Loading the timetable…</p>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="/js/main.js"></script>
  <script src="/js/substitution-defaults.js"></script>
  <script src="/js/timetable-view.js"></script>
  <script>
    // Saved timetable from the admin panel; the built-in 2026-27 timetable until the admin saves one.
    fetch("/api/substitution").then(r => (r.ok ? r.json() : {})).catch(() => ({})).then(d => {
      TimetableView.mount(document.getElementById("timetable"), {
        timetable: d.timetable || buildDefaultTimetable(),
        teachers: d.teachers || TEACHERS,
        periodTimes: d.periodTimes && Object.keys(d.periodTimes).length ? d.periodTimes : PERIOD_TIMES,
        periodTimesSat: d.periodTimesSat || null,
      });
    });
  </script>
</body>
