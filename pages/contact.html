<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | SAGES Sonhat</title>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="/images/favicon.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <div class="page-banner">
    <h1>Contact Us</h1>
    <div class="breadcrumb"><a href="/">Home</a> / Contact Us</div>
  </div>

  <section>
    <div class="container two-col">
      <div class="content">
        <h2>Get in Touch</h2>
        <div class="info-box" data-render="contactInfo"></div>
        <iframe class="map" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d6142.115677347553!2d82.51733247532758!3d23.47710987885774!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x398893f441a70223%3A0x8e48af92dada62b1!2sSwami%20Atmanand%20Government%20English%20Medium%20School%20Sonhat%20Koriya!5e1!3m2!1sen!2sin!4v1793126577137!5m2!1sen!2sin" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin" title="Map to SAGES Sonhat"></iframe>
      </div>
      <div class="content">
        <h2>Send a Message</h2>
        <form class="form">
          <div class="row">
            <div><label>Your Name</label><input required></div>
            <div><label>Mobile Number</label><input type="tel" required></div>
          </div>
          <div><label>Email</label><input type="email"></div>
          <div><label>Subject</label><input required></div>
          <div><label>Message</label><textarea rows="5" required></textarea></div>
          <button class="btn" type="submit">Send Message</button>
          <div class="form-msg">Thank you! Your message has been received.</div>
        </form>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="/js/main.js"></script>
</body>
</html>
