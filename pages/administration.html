<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration | SAGES Sonhat</title>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="/images/favicon.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <div class="page-banner">
    <h1>Administration</h1>
    <div class="breadcrumb"><a href="/">Home</a> / Administration</div>
  </div>

  <section id="principal">
    <div class="container principal" data-render="principalFull"></div>
  </section>

  <section id="smc" class="bg-soft">
    <div class="container">
      <div class="section-title"><span>Governance</span><h2>School Management Committee</h2></div>
      <div data-render="smc"></div>
    </div>
  </section>

  <section id="faculty">
    <div class="container">
      <div class="section-title"><span>Teaching Staff</span><h2>Our Faculty</h2></div>
      <div class="faculty-grid" data-render="faculty"></div>
    </div>
  </section>

  <section id="staff" class="bg-soft">
    <div class="container">
      <div class="section-title"><span>Support</span><h2>Administrative Staff</h2></div>
      <div class="faculty-grid" data-render="staff"></div>
    </div>
  </section>

  <section id="pta">
    <div class="container content">
      <div class="section-title"><span>Partnership</span><h2>Parent Teacher Association</h2></div>
      <div data-render="pta"></div>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="/js/main.js"></script>
</body>
</html>
