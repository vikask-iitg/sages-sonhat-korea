<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin | SAGES Sonhat</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="/images/favicon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div id="login" class="login" hidden>
    <form id="login-form" class="login-card">
      <img src="/images/logo.png" alt="" class="login-logo">
      <h1>Admin Login</h1>
      <p>SAGES Sonhat website</p>
      <input id="email" type="email" placeholder="Email ID" autocomplete="username" required>
      <div class="pw-wrap">
        <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
        <button type="button" id="pw-toggle" class="pw-toggle" aria-label="Show password" title="Show password"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <button type="submit">Log in</button>
      <div id="login-error" class="error"></div>
      <a href="/" class="back-link"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>Back to website</a>
    </form>
  </div>

  <div id="app" hidden>
    <header class="bar">
      <div class="brand"><img src="/images/logo.png" alt=""> SAGES Sonhat · Admin</div>
      <div class="bar-actions">
        <span id="session-left" class="state session"></span>
        <span id="save-state" class="state ok">All changes saved</span>
        <button id="save" class="btn primary" data-action="save" disabled>💾 Save changes</button>
        <a class="btn" href="/" target="_blank">View website ↗</a>
        <button class="btn logout-btn" data-action="logout"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>Log out</button>
      </div>
    </header>
    <div class="layout">
      <nav id="sections" class="sidebar"></nav>
      <main id="editor" class="editor"></main>
    </div>
  </div>

  <div id="crop-modal" class="crop-modal" hidden>
    <div class="crop-box">
      <h3>Adjust photo <span id="crop-shape" class="shape"></span></h3>
      <p class="hint">Drag the photo to move it and scroll or pinch to zoom. The box shows exactly what appears on the website.</p>
      <div class="crop-area"><img id="crop-img" alt=""></div>
      <div class="crop-actions">
        <button id="crop-cancel" class="btn-sm">Cancel</button>
        <button id="crop-ok" class="btn-sm primary">✓ Crop &amp; use photo</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
