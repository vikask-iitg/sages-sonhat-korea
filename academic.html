<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academic | SAGES Sonhat</title>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="images/favicon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <div class="page-banner">
    <h1>Academic</h1>
    <div class="breadcrumb"><a href="index.html">Home</a> / Academic</div>
  </div>

  <section id="curriculum">
    <div class="container">
      <div class="section-title"><span>Learning</span><h2>Classes &amp; Curriculum</h2></div>
      <div data-render="curriculum"></div>
    </div>
  </section>

  <section id="results" class="bg-soft">
    <div class="container">
      <div class="section-title"><span>Performance</span><h2>Board Results</h2></div>
      <div data-render="results"></div>
    </div>
  </section>

  <section id="achievements">
    <div class="container">
      <div class="section-title"><span>Proud Moments</span><h2>Student Achievements</h2></div>
      <div class="card-grid" data-render="achievements"></div>
    </div>
  </section>

  <section id="calendar" class="bg-soft">
    <div class="container">
      <div class="section-title"><span>Session 2026-27</span><h2>School Calendar</h2></div>
      <div data-render="calendar"></div>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="js/main.js"></script>

</html>
