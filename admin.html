<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin | SAGES Sonhat</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="images/favicon.png">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div id="login" class="login" hidden>
    <form id="login-form" class="login-card">
      <img src="images/logo.png" alt="" class="login-logo">
      <h1>Admin Login</h1>
      <p>SAGES Sonhat website</p>
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
      <button type="submit">Log in</button>
      <div id="login-error" class="error"></div>
      <a href="index.html">← Back to website</a>
    </form>
  </div>

  <div id="app" hidden>
    <header class="bar">
      <div class="brand"><img src="images/logo.png" alt=""> SAGES Sonhat · Admin</div>
      <div class="bar-actions">
        <span id="save-state" class="state ok">All changes saved</span>
        <button id="save" class="btn primary" data-action="save" disabled>💾 Save changes</button>
        <a class="btn" href="index.html" target="_blank">View website ↗</a>
        <button class="btn" data-action="logout">Log out</button>
      </div>
    </header>
    <div class="layout">
      <nav id="sections" class="sidebar"></nav>
      <main id="editor" class="editor"></main>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="js/admin.js"></script>
</body>
</html>
